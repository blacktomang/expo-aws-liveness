// Compose plugin classpath. Pinned to match Expo SDK 54's Kotlin (2.0.21).
// If Expo bumps Kotlin, this version must move with it — Compose plugin and
// Kotlin compiler are tightly coupled.
buildscript {
  ext.kotlinComposeVersion = '2.0.21'
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinComposeVersion}"
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.awsliveness'
version = '0.1.0'

android {
  namespace 'expo.modules.awsliveness'
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

  // liveness 1.6.0+ ships 16 KB-aligned .so files (2**14); 1.5.0 was 4 KB (2**12).
  // 1.10.0 also drops org.tensorflow:tensorflow-lite in favour of
  // com.google.ai.edge.litert:litert (16 KB aligned), removing libtensorflowlite_jni.so.
  // Requires Amplify core 2.33.0.
  implementation 'com.amplifyframework.ui:liveness:1.10.0'
  implementation 'com.amplifyframework:core:2.33.0'
  implementation 'com.amplifyframework:aws-auth-cognito:2.33.0'
  // material3 is declared runtime-only by liveness 1.10.0, so it won't appear on
  // our compile classpath unless we add it here. Our code uses MaterialTheme/ColorScheme
  // directly. Version 1.3.1 matches liveness 1.10.0's Compose 1.7 BOM.
  implementation 'androidx.compose.material3:material3:1.3.1'
}
