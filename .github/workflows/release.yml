name: Release

# Publish to npm when a version tag is pushed:
#   git tag v0.2.2 && git push origin v0.2.2
# The tag (minus the leading "v") becomes the published version. Nothing is
# committed back to the repo, so no branch-protection bypass is needed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          EXPO_NONINTERACTIVE=1 pnpm run build

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
